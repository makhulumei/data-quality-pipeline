name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install --requirement requirements-dev.lock
      - run: ruff check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install pip-audit==2.9.0 bandit==1.8.6 detect-secrets==1.5.0
      - run: pip-audit --requirement requirements.lock --progress-spinner off
      - run: pip-audit --requirement requirements-dev.lock --progress-spinner off
      - run: bandit -r src scripts --severity-level medium --confidence-level medium
      - name: Scan tracked source and configuration files for secrets
        run: git ls-files -z -- . ':(exclude)benchmark_results/**' ':(exclude)assets/**' | xargs -0 detect-secrets-hook

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: pytest -m "not integration" --cov=data_quality_pipeline --cov-report=term-missing

  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: data_quality
          POSTGRES_USER: dq_user
          POSTGRES_PASSWORD: dq_password # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dq_user -d data_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dq_user:dq_password@127.0.0.1:5432/data_quality # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: pytest -m integration

  package-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install build==1.3.0 hatchling==1.27.0
      - run: python -m build --no-isolation
      - run: python -m venv /tmp/dq-wheel-test
      - run: /tmp/dq-wheel-test/bin/python -m pip install --upgrade pip==26.2.1
      - run: /tmp/dq-wheel-test/bin/python -m pip install --requirement requirements.lock
      - run: /tmp/dq-wheel-test/bin/python -m pip install --no-deps dist/*.whl
      - run: /tmp/dq-wheel-test/bin/dq-pipeline --help
      - run: docker build --tag data-quality-pipeline:ci .
