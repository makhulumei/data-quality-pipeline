services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://dq_user:dq_password@postgres:5432/data_quality # pragma: allowlist secret
      MAX_UPLOAD_MB: "50"
      MAX_XLSX_EXPANDED_MB: "200"
      MAX_PREVIEW_ROWS: "0"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: data_quality
      POSTGRES_USER: dq_user
      POSTGRES_PASSWORD: dq_password # pragma: allowlist secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq_user -d data_quality"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
